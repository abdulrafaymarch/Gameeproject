<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>From Logic To Legends - Ultimate Gaming Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Orbitron', monospace;
            background: linear-gradient(45deg, #00ff99, #002244, #001a33, #003366);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            color: #fff;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 1rem;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #00ff99;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(45deg, #00ff99, #003366);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        .controls {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-bar {
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #00ff99;
            border-radius: 25px;
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
            width: 150px;
        }

        .search-bar:focus {
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            transform: scale(1.05);
        }

        .control-btn {
            padding: 0.5rem 1rem;
            background: linear-gradient(45deg, #003366, #00ff99);
            border: none;
            border-radius: 25px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .control-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(1, 111, 161, 0.5);
        }

        .main-content {
            margin-top: 80px;
            padding: 1rem;
            min-height: calc(100vh - 160px);
        }

        .hero-section {
            text-align: center;
            padding: 2rem 0;
            animation: fadeInUp 1s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero-title {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #00e6ff, #00ff88, #ffff00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px rgba(98, 0, 255, 0.5); }
            to { text-shadow: 0 0 30px rgba(112, 24, 112, 0.8); }
        }

        .categories {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 2rem 0;
            flex-wrap: wrap;
        }

        .category-btn {
            padding: 0.8rem 1.5rem;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #00ff99;
            border-radius: 30px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .category-btn:hover, .category-btn.active {
            background: linear-gradient(45deg, #00ff99, #003366);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 255, 255, 0.3);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #00ff99;
            border-radius: 20px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(0, 255, 255, 0.1), transparent);
            transform: rotate(45deg);
            transition: all 0.5s ease;
            opacity: 0;
        }

        .game-card:hover::before {
            opacity: 1;
            animation: shine 1s ease;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .game-card:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 20px 40px rgba(0, 255, 255, 0.3);
            border-color: #003366;
        }

        .game-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
        }

        .game-title {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            color: #00ff99;
        }

        .game-description {
            color: #ccc;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .play-btn {
            padding: 0.8rem 1.5rem;
            background: linear-gradient(45deg, #003366, #00ff99);
            border: none;
            border-radius: 25px;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .play-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(1, 111, 161, 0.5);
        }

        .game-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            backdrop-filter: blur(10px);
            padding: 1rem;
        }

        .game-container {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00ff99;
            border-radius: 20px;
            padding: 1rem;
            max-width: 95vw;
            max-height: 95vh;
            overflow: auto;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            border-bottom: 2px solid #00ff99;
            padding-bottom: 0.5rem;
            flex-wrap: wrap;
        }

        .close-btn {
            background: #ff0066;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            color: #fff;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255, 0, 102, 0.5);
        }

        .game-canvas-container {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 0.5rem;
        }

        .game-canvas {
            border: 2px solid #00ff99;
            border-radius: 10px;
            background: #000;
            max-width: 100%;
            height: auto;
        }

        .game-controls {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
            flex-wrap: wrap;
        }

        .game-btn {
            padding: 0.5rem 1rem;
            background: linear-gradient(45deg, #003366, #00ff99);
            border: none;
            border-radius: 20px;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .game-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        .score-display {
            text-align: center;
            margin: 0.5rem 0;
            font-size: 1.2rem;
            color: #00ff99;
        }

        .floating-launcher {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00ff99;
            border-radius: 50px;
            padding: 0.8rem;
            display: flex;
            gap: 0.5rem;
            backdrop-filter: blur(10px);
            z-index: 1500;
            transition: all 0.3s ease;
            max-width: 90vw;
            overflow-x: auto;
        }

        .launcher-icon {
            min-width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(45deg, #003366, #00ff99);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.2rem;
        }

        .launcher-icon:hover {
            transform: scale(1.2);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        .hidden {
            display: none !important;
        }

        .fade-in {
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Light Theme Styles */
        .light-theme {
            background: linear-gradient(45deg, #f0f0f0, #e6e6ff, #ffe6e6, #e6ffe6);
            color: #333;
        }

        .light-theme .header {
            background: rgba(255, 255, 255, 0.9);
            border-bottom: 2px solid #00ff99;
        }

        .light-theme .logo {
            background: linear-gradient(45deg, #00ff99, #003366);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .light-theme .search-bar {
            background: rgba(0, 0, 0, 0.1);
            border: 2px solid #00ff99;
            color: #333;
        }

        .light-theme .control-btn {
            background: linear-gradient(45deg, #003366, #00ff99);
        }

        .light-theme .category-btn {
            background: rgba(0, 0, 0, 0.1);
            border: 2px solid #00ff99;
            color: #333;
        }

        .light-theme .category-btn:hover, .light-theme .category-btn.active {
            background: linear-gradient(45deg, #00ff99, #003366);
            color: #fff;
        }

        .light-theme .game-card {
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid #00ff99;
            color: #333;
        }

        .light-theme .game-title {
            color: #003366;
        }

        .light-theme .game-description {
            color: #666;
        }

        .light-theme .floating-launcher {
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #00ff99;
        }

        .light-theme .hero-title {
            background: linear-gradient(45deg, #003366, #00ff99);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
        }

        /* Modal Base */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        /* Modal content box */
        .modal-content {
            background: #111;
            border: 2px solid #00ff99;
            border-radius: 15px;
            padding: 1.5rem;
            width: 90%;
            max-width: 400px;
            color: #fff;
            text-align: center;
            position: relative;
            animation: fadeIn 0.3s ease-in-out;
        }

        /* Close button */
        .modal-content .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            font-weight: bold;
            color: #00ff99;
            cursor: pointer;
            transition: color 0.3s ease;
        }
        .modal-content .close-btn:hover {
            color: red;
        }

        /* Profile Section inside modal */
        .modal-content .profile-section {
            background: transparent;
            border: none;
            padding: 0;
            box-shadow: none;
        }
        .profile-name {
            color: #00ff99;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        .high-scores {
            font-size: 1rem;
            color: #ccc;
        }

        /* Mobile touch controls */
        .touch-controls {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 3000;
            gap: 10px;
        }

        .touch-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(0, 255, 153, 0.7);
            border: 2px solid #00ff99;
            color: #fff;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Media Queries */
        @media (max-width: 1200px) {
            .hero-title {
                font-size: 2.2rem;
            }
            .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            }
        }

        @media (max-width: 992px) {
            .hero-title {
                font-size: 2rem;
            }
            .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }
            .game-icon {
                font-size: 2.5rem;
            }
        }

        @media (max-width: 768px) {
            .header {
                padding: 0.8rem;
                justify-content: center;
            }
            
            .logo {
                font-size: 1.5rem;
                margin-bottom: 0.5rem;
                width: 100%;
                text-align: center;
            }
            
            .controls {
                width: 100%;
                justify-content: center;
            }
            
            .search-bar {
                width: 120px;
                font-size: 0.8rem;
            }
            
            .control-btn {
                padding: 0.4rem 0.8rem;
                font-size: 0.8rem;
            }
            
            .main-content {
                margin-top: 120px;
                padding: 0.8rem;
            }
            
            .hero-title {
                font-size: 1.8rem;
            }
            
            .categories {
                gap: 0.5rem;
            }
            
            .category-btn {
                padding: 0.6rem 1rem;
                font-size: 0.8rem;
            }
            
            .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 1rem;
            }
            
            .game-card {
                padding: 1rem;
            }
            
            .game-icon {
                font-size: 2rem;
            }
            
            .game-title {
                font-size: 1.1rem;
            }
            
            .game-description {
                font-size: 0.8rem;
            }
            
            .play-btn {
                padding: 0.6rem 1rem;
                font-size: 0.8rem;
            }
            
            .floating-launcher {
                bottom: 10px;
                right: 10px;
                padding: 0.5rem;
            }
            
            .launcher-icon {
                min-width: 35px;
                height: 35px;
                font-size: 1rem;
            }
            
            .game-container {
                padding: 0.8rem;
            }
            
            .game-header {
                margin-bottom: 0.3rem;
                padding-bottom: 0.3rem;
            }
            
            .close-btn {
                width: 30px;
                height: 30px;
                font-size: 1rem;
            }
            
            .game-controls {
                gap: 0.3rem;
            }
            
            .game-btn {
                padding: 0.4rem 0.8rem;
                font-size: 0.8rem;
            }
            
            .score-display {
                font-size: 1rem;
            }
            
            .touch-controls {
                display: flex;
            }
        }

        @media (max-width: 576px) {
            .header {
                flex-direction: column;
                padding: 0.5rem;
            }
            
            .logo {
                margin-bottom: 0.3rem;
            }
            
            .controls {
                gap: 0.3rem;
            }
            
            .search-bar {
                width: 100px;
            }
            
            .main-content {
                margin-top: 140px;
            }
            
            .hero-title {
                font-size: 1.5rem;
            }
            
            .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 0.8rem;
            }
            
            .game-card {
                padding: 0.8rem;
            }
            
            .game-icon {
                font-size: 1.8rem;
            }
            
            .game-title {
                font-size: 1rem;
            }
            
            .game-description {
                font-size: 0.75rem;
            }
            
            .play-btn {
                padding: 0.5rem 0.8rem;
                font-size: 0.75rem;
            }
            
            .modal-content {
                padding: 1rem;
                width: 95%;
            }
            
            .touch-controls {
                bottom: 10px;
                left: 10px;
            }
            
            .touch-btn {
                width: 50px;
                height: 50px;
                font-size: 20px;
            }
        }

        @media (max-width: 400px) {
            .hero-title {
                font-size: 1.3rem;
            }
            
            .games-grid {
                grid-template-columns: 1fr 1fr;
            }
            
            .game-icon {
                font-size: 1.5rem;
            }
            
            .game-title {
                font-size: 0.9rem;
            }
            
            .game-description {
                font-size: 0.7rem;
            }
            
            .play-btn {
                padding: 0.4rem 0.6rem;
                font-size: 0.7rem;
            }
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="logo">🎮 From Logic To Legends</div>
        <div class="controls">
            <input type="text" class="search-bar" placeholder="Search games..." id="searchBar">
            <button class="control-btn" id="musicToggle">🎵 Music</button>
            <button class="control-btn" id="themeToggle">🌙 Dark</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Hero Section -->
        <section class="hero-section">
            <h1 class="hero-title">From Logic To Legends</h1>
            <p style="font-size: 1rem; color: rgb(73, 71, 71);">Experience the future of browser gaming</p>
        </section>

        <!-- Categories -->
        <div class="categories">
            <button class="category-btn active" data-category="all">All Games</button>
            <button class="category-btn" data-category="action">Action</button>
            <button class="category-btn" data-category="puzzle">Puzzle</button>
            <button class="category-btn" data-category="arcade">Arcade</button>
            <button class="category-btn" data-category="score" onclick="openProfileModal()">Score</button>
        </div>

        <!-- Games Grid -->
        <div class="games-grid" id="gamesGrid">
            <!-- Games will be populated by JavaScript -->
        </div>
    </main>

    <!-- Floating Launcher -->
    <div class="floating-launcher" id="floatingLauncher">
        <!-- Launcher icons will be populated by JavaScript -->
    </div>

    <!-- Game Modal -->
    <div class="game-modal" id="gameModal">
        <div class="game-container">
            <div class="game-header">
                <h2 id="currentGameTitle">Game Title</h2>
                <button class="close-btn" id="closeGame">×</button>
            </div>
            <div class="score-display" id="scoreDisplay">Score: 0</div>
            <div class="game-canvas-container">
                <canvas class="game-canvas" id="gameCanvas"></canvas>
            </div>
            <div class="game-controls">
                <button class="game-btn" id="startGame">Start Game</button>
                <button class="game-btn" id="restartGame">Restart</button>
                <button class="game-btn" id="pauseGame">Pause</button>
            </div>
        </div>
    </div>

    <!-- Profile Modal -->
    <div id="profileModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeProfileModal()">&times;</span>
            <div class="profile-section">
                <div class="profile-name" id="playerName">Player: Gamer</div>
                <div class="high-scores" id="highScores">
                    <div>Snake: 0</div>
                    <div>Tetris: 0</div>
                    <div>Shooter: 0</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Touch Controls for Mobile -->
    <div class="touch-controls" id="touchControls">
        <div class="touch-btn" id="touchLeft">←</div>
        <div class="touch-btn" id="touchUp">↑</div>
        <div class="touch-btn" id="touchDown">↓</div>
        <div class="touch-btn" id="touchRight">→</div>
        <div class="touch-btn" id="touchAction">⚡</div>
    </div>

    <!-- Audio Elements -->
    <audio id="backgroundMusic" loop>
        <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBSuBzvLZiTYIG2m98OScTgwOUarm7blmGgU7k9n1unEiBC13yO/eizEIHWq+8+OWT" type="audio/wav">
    </audio>

    <script>
        // Modal functions
        function openProfileModal() {
            document.getElementById("profileModal").style.display = "flex";
        }
        
        function closeProfileModal() {
            document.getElementById("profileModal").style.display = "none";
        }
        
        // Close modal on outside click
        window.onclick = function(event) {
            const modal = document.getElementById("profileModal");
            if (event.target === modal) {
                modal.style.display = "none";
            }
        };

        // Game System
        class GameSystem {
            constructor() {
                this.games = [];
                this.currentGame = null;
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.gameModal = document.getElementById('gameModal');
                this.musicEnabled = true;
                this.soundEnabled = true;
                this.playerName = localStorage.getItem('playerName') || 'Gamer';
                this.highScores = JSON.parse(localStorage.getItem('highScores')) || {};
                this.isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                this.touchControls = {
                    left: false,
                    right: false,
                    up: false,
                    down: false,
                    action: false
                };

                this.initializeGames();
                this.setupEventListeners();
                this.renderGames();
                this.updateProfile();
                this.setupTouchControls();
                this.playBackgroundMusic();
            }

            initializeGames() {
                this.games = [
                    {
                        id: 'Snake',
                        title: 'Neon Snake',
                        description: 'Classic Snake game with neon effects',
                        category: 'arcade',
                        icon: '🐍',
                        game: new SnakeGame()
                    },
                    {
                        id: 'Tetris',
                        title: 'Coin Collector',
