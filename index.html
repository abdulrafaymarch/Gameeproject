                this.paused = !this.paused;

                if (this.paused) {
                    if (this.gameLoop) {
                        clearInterval(this.gameLoop);
                        this.gameLoop = null;
                    }
                    this.drawPauseScreen();
                    this.gameSystem.playSound('pause');
                } else {
                    this.gameLoop = setInterval(() => this.update(), 16);
                    this.gameSystem.playSound('resume');
                }
            }

            drawPauseScreen() {
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                this.ctx.fillStyle = '#00ff99';
                this.ctx.font = `${Math.max(32, this.canvas.width / 15)}px Orbitron`;
                this.ctx.textAlign = 'center';
                this.ctx.shadowColor = '#00ff99';
                this.ctx.shadowBlur = 10;
                this.ctx.fillText('PAUSED', this.canvas.width / 2, this.canvas.height / 2);
                this.ctx.font = `${Math.max(16, this.canvas.width / 30)}px Orbitron`;
                this.ctx.fillText('Press Pause to continue', this.canvas.width / 2, this.canvas.height / 2 + 50);
                this.ctx.shadowBlur = 0;
            }

            restart() {
                this.pause();
                this.init();
            }

            stop() {
                this.pause();
            }

            update() {
                if (!this.running) return;

                // Ship controls
                if (this.keys['ArrowLeft'] || this.gameSystem.touchControls.left) {
                    this.ship.angle -= 0.1;
                }
                if (this.keys['ArrowRight'] || this.gameSystem.touchControls.right) {
                    this.ship.angle += 0.1;
                }
                if (this.keys['ArrowUp'] || this.gameSystem.touchControls.up) {
                    this.ship.dx += Math.cos(this.ship.angle) * 0.3;
                    this.ship.dy += Math.sin(this.ship.angle) * 0.3;
                }

                // Apply friction
                this.ship.dx *= 0.99;
                this.ship.dy *= 0.99;

                // Move ship
                this.ship.x += this.ship.dx;
                this.ship.y += this.ship.dy;

                // Wrap ship around screen
                this.ship.x = (this.ship.x + this.canvas.width) % this.canvas.width;
                this.ship.y = (this.ship.y + this.canvas.height) % this.canvas.height;

                // Update bullets
                this.bullets = this.bullets.filter(bullet => {
                    bullet.x += bullet.dx;
                    bullet.y += bullet.dy;
                    bullet.life--;

                    // Wrap bullets
                    bullet.x = (bullet.x + this.canvas.width) % this.canvas.width;
                    bullet.y = (bullet.y + this.canvas.height) % this.canvas.height;

                    return bullet.life > 0;
                });

                // Update asteroids
                this.asteroids.forEach(asteroid => {
                    asteroid.x += asteroid.dx;
                    asteroid.y += asteroid.dy;
                    asteroid.angle += 0.02;

                    // Wrap asteroids
                    asteroid.x = (asteroid.x + this.canvas.width) % this.canvas.width;
                    asteroid.y = (asteroid.y + this.canvas.height) % this.canvas.height;
                });

                // Check collisions
                this.checkCollisions();
                this.draw();
            }

            checkCollisions() {
                // Bullet-asteroid collisions
                for (let i = this.bullets.length - 1; i >= 0; i--) {
                    for (let j = this.asteroids.length - 1; j >= 0; j--) {
                        const bullet = this.bullets[i];
                        const asteroid = this.asteroids[j];
                        const dx = bullet.x - asteroid.x;
                        const dy = bullet.y - asteroid.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < asteroid.size) {
                            this.bullets.splice(i, 1);
                            this.asteroids.splice(j, 1);
                            this.score += 10;
                            this.gameSystem.updateScore(this.score);

                            // Split asteroid if large enough
                            if (asteroid.size > 15) {
                                for (let k = 0; k < 2; k++) {
                                    this.asteroids.push({
                                        x: asteroid.x,
                                        y: asteroid.y,
                                        dx: (Math.random() - 0.5) * 6,
                                        dy: (Math.random() - 0.5) * 6,
                                        size: asteroid.size / 2,
                                        angle: Math.random() * Math.PI * 2
                                    });
                                }
                            }
                            break;
                        }
                    }
                }

                // Ship-asteroid collisions
                for (let asteroid of this.asteroids) {
                    const dx = this.ship.x - asteroid.x;
                    const dy = this.ship.y - asteroid.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < asteroid.size + this.ship.size) {
                        this.gameOver();
                        return;
                    }
                }

                // Check win condition
                if (this.asteroids.length === 0) {
                    this.initAsteroids();
                    this.score += 100;
                    this.gameSystem.updateScore(this.score);
                }
            }

            shoot() {
                this.bullets.push({
                    x: this.ship.x,
                    y: this.ship.y,
                    dx: Math.cos(this.ship.angle) * 10,
                    dy: Math.sin(this.ship.angle) * 10,
                    life: 60
                });
                this.gameSystem.playSound('shoot');
            }

            draw() {
                this.ctx.fillStyle = '#000';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // Draw stars
                this.ctx.fillStyle = '#fff';
                const starCount = Math.max(50, Math.floor(this.canvas.width * this.canvas.height / 5000));
                for (let i = 0; i < starCount; i++) {
                    const x = (i * 37) % this.canvas.width;
                    const y = (i * 73) % this.canvas.height;
                    this.ctx.fillRect(x, y, 1, 1);
                }

                // Draw ship
                this.ctx.save();
                this.ctx.translate(this.ship.x, this.ship.y);
                this.ctx.rotate(this.ship.angle);
                this.ctx.strokeStyle = '#00ff99';
                this.ctx.shadowColor = '#00ff99';
                this.ctx.shadowBlur = 10;
                this.ctx.beginPath();
                this.ctx.moveTo(this.ship.size * 1.5, 0);
                this.ctx.lineTo(-this.ship.size, -this.ship.size * 0.8);
                this.ctx.lineTo(-this.ship.size * 0.5, 0);
                this.ctx.lineTo(-this.ship.size, this.ship.size * 0.8);
                this.ctx.closePath();
                this.ctx.stroke();
                this.ctx.restore();

                // Draw bullets
                this.ctx.fillStyle = '#ffff00';
                this.ctx.shadowColor = '#ffff00';
                this.bullets.forEach(bullet => {
                    this.ctx.fillRect(bullet.x - 2, bullet.y - 2, 4, 4);
                });

                // Draw asteroids
                this.ctx.strokeStyle = '#003366';
                this.ctx.shadowColor = '#003366';
                this.asteroids.forEach(asteroid => {
                    this.ctx.save();
                    this.ctx.translate(asteroid.x, asteroid.y);
                    this.ctx.rotate(asteroid.angle);
                    this.ctx.beginPath();
                    for (let i = 0; i < 8; i++) {
                        const angle = (i / 8) * Math.PI * 2;
                        const radius = asteroid.size + Math.sin(i) * 5;
                        const x = Math.cos(angle) * radius;
                        const y = Math.sin(angle) * radius;
                        if (i === 0) {
                            this.ctx.moveTo(x, y);
                        } else {
                            this.ctx.lineTo(x, y);
                        }
                    }
                    this.ctx.closePath();
                    this.ctx.stroke();
                    this.ctx.restore();
                });

                this.ctx.shadowBlur = 0;
            }

            handleKeyDown(e) {
                this.keys[e.key] = true;
                if (e.key === ' ') {
                    this.shoot();
                    e.preventDefault();
                }
            }

            handleKeyUp(e) {
                this.keys[e.key] = false;
            }

            handleTouchStart(action) {
                if (action === 'left') {
                    this.keys['ArrowLeft'] = true;
                }
                if (action === 'right') {
                    this.keys['ArrowRight'] = true;
                }
                if (action === 'up') {
                    this.keys['ArrowUp'] = true;
                }
                if (action === 'action') {
                    this.shoot();
                }
            }

            handleTouchEnd(action) {
                if (action === 'left') {
                    this.keys['ArrowLeft'] = false;
                }
                if (action === 'right') {
                    this.keys['ArrowRight'] = false;
                }
                if (action === 'up') {
                    this.keys['ArrowUp'] = false;
                }
            }

            handleResize() {
                // Adjust ship position if it's outside the new canvas bounds
                if (this.ship.x > this.canvas.width) {
                    this.ship.x = this.canvas.width / 2;
                }
                if (this.ship.y > this.canvas.height) {
                    this.ship.y = this.canvas.height / 2;
                }
                this.draw();
            }

            gameOver() {
                this.running = false;
                clearInterval(this.gameLoop);

                this.ctx.fillStyle = 'rgba(255, 0, 102, 0.8)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                this.ctx.fillStyle = '#fff';
                this.ctx.font = `${Math.max(36, this.canvas.width / 15)}px Orbitron`;
                this.ctx.textAlign = 'center';
                this.ctx.fillText('GAME OVER', this.canvas.width / 2, this.canvas.height / 2);
                this.ctx.font = `${Math.max(20, this.canvas.width / 25)}px Orbitron`;
                this.ctx.fillText(`Score: ${this.score}`, this.canvas.width / 2, this.canvas.height / 2 + 50);
            }
        }

        // Memory Game
        class MemoryGame {
            constructor() {
                this.cards = [];
                this.flippedCards = [];
                this.matchedPairs = 0;
                this.score = 0;
                this.running = false;
                this.selectedCard = 0;
                this.showTime = 0;
                this.gridSize = 4;
                this.totalPairs = 8;
                this.symbols = ['🌟', '💎', '🔥', '⚡', '🌙', '☄️', '💫', '🎯'];
                this.isMobile = false;
            }

            init() {
                this.generateCards();
                this.flippedCards = [];
                this.matchedPairs = 0;
                this.score = 0;
                this.running = false;
                this.selectedCard = 0;
                this.showTime = 0;
                this.draw();
            }

            generateCards() {
                this.cards = [];
                const symbols = [...this.symbols];

                // Create pairs
                for (let i = 0; i < this.totalPairs; i++) {
                    this.cards.push({
                        id: i * 2,
                        symbol: symbols[i],
                        flipped: false,
                        matched: false
                    });
                    this.cards.push({
                        id: i * 2 + 1,
                        symbol: symbols[i],
                        flipped: false,
                        matched: false
                    });
                }

                // Shuffle cards
                for (let i = this.cards.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [this.cards[i], this.cards[j]] = [this.cards[j], this.cards[i]];
                }
            }

            start() {
                this.running = true;
                // Show all cards briefly at start
                this.cards.forEach(card => card.flipped = true);
                this.showTime = 60; // Show for 1 second
                this.draw();

                setTimeout(() => {
                    this.cards.forEach(card => card.flipped = false);
                    this.draw();
                }, 1000);
            }

            pause() {
                this.running = false;
            }

            restart() {
                this.init();
            }

            stop() {
                this.running = false;
            }

            flipCard(index) {
                if (!this.running || this.flippedCards.length >= 2) return;

                const card = this.cards[index];
                if (card.flipped || card.matched) return;

                card.flipped = true;
                this.flippedCards.push(index);

                if (this.flippedCards.length === 2) {
                    setTimeout(() => this.checkMatch(), 1000);
                }

                this.draw();
            }

            checkMatch() {
                const [first, second] = this.flippedCards;
                const card1 = this.cards[first];
                const card2 = this.cards[second];

                if (card1.symbol === card2.symbol) {
                    // Match found
                    card1.matched = true;
                    card2.matched = true;
                    this.matchedPairs++;
                    this.score += 100;
                    this.gameSystem.updateScore(this.score);

                    if (this.matchedPairs === this.totalPairs) {
                        this.gameWin();
                    }
                } else {
                    // No match
                    card1.flipped = false;
                    card2.flipped = false;
                    this.score = Math.max(0, this.score - 10);
                    this.gameSystem.updateScore(this.score);
                }

                this.flippedCards = [];
                this.draw();
            }

            draw() {
                this.ctx.fillStyle = '#000';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // Calculate card size based on canvas dimensions
                const cardSize = Math.min(
                    (this.canvas.width - (this.gridSize + 1) * 20) / this.gridSize,
                    (this.canvas.height - (this.gridSize + 1) * 20) / this.gridSize
                );
                const spacing = 20;
                const startX = (this.canvas.width - (this.gridSize * cardSize + (this.gridSize - 1) * spacing)) / 2;
                const startY = (this.canvas.height - (this.gridSize * cardSize + (this.gridSize - 1) * spacing)) / 2;

                // Draw cards
                this.cards.forEach((card, index) => {
                    const row = Math.floor(index / this.gridSize);
                    const col = index % this.gridSize;
                    const x = startX + col * (cardSize + spacing);
                    const y = startY + row * (cardSize + spacing);

                    // Card background
                    if (card.matched) {
                        this.ctx.fillStyle = '#00ff00';
                        this.ctx.shadowColor = '#00ff00';
                    } else if (card.flipped) {
                        this.ctx.fillStyle = '#00ff99';
                        this.ctx.shadowColor = '#00ff99';
                    } else {
                        this.ctx.fillStyle = '#333';
                        this.ctx.shadowColor = '#333';
                    }

                    if (index === this.selectedCard && !card.flipped && !card.matched) {
                        this.ctx.fillStyle = '#003366';
                        this.ctx.shadowColor = '#003366';
                    }

                    this.ctx.shadowBlur = 5;
                    this.ctx.fillRect(x, y, cardSize, cardSize);

                    // Card border
                    this.ctx.strokeStyle = '#fff';
                    this.ctx.lineWidth = 2;
                    this.ctx.strokeRect(x, y, cardSize, cardSize);

                    // Card content
                    if (card.flipped || card.matched) {
                        this.ctx.font = `${cardSize * 0.5}px Arial`;
                        this.ctx.textAlign = 'center';
                        this.ctx.fillStyle = '#fff';
                        this.ctx.fillText(card.symbol, x + cardSize / 2, y + cardSize / 2 + cardSize * 0.15);
                    } else {
                        // Card back
                        this.ctx.font = `${cardSize * 0.4}px Orbitron`;
                        this.ctx.textAlign = 'center';
                        this.ctx.fillStyle = '#666';
                        this.ctx.fillText('?', x + cardSize / 2, y + cardSize / 2 + cardSize * 0.1);
                    }
                });

                // Draw instructions
                this.ctx.fillStyle = '#fff';
                this.ctx.font = `${Math.max(14, this.canvas.width / 40)}px Orbitron`;
                this.ctx.textAlign = 'center';
                this.ctx.shadowBlur = 0;
                this.ctx.fillText('Find matching pairs!', this.canvas.width / 2, 30);
                this.ctx.fillText('Arrow keys to move, Space to flip', this.canvas.width / 2, 50);
                this.ctx.fillText(`Pairs found: ${this.matchedPairs}/${this.totalPairs}`, this.canvas.width / 2, this.canvas.height - 30);
            }

            handleKeyDown(e) {
                if (!this.running) return;

                switch (e.key) {
                    case 'ArrowLeft':
                        this.selectedCard = Math.max(0, this.selectedCard - 1);
                        break;
                    case 'ArrowRight':
                        this.selectedCard = Math.min(15, this.selectedCard + 1);
                        break;
                    case 'ArrowUp':
                        this.selectedCard = Math.max(0, this.selectedCard - 4);
                        break;
                    case 'ArrowDown':
                        this.selectedCard = Math.min(15, this.selectedCard + 4);
                        break;
                    case ' ':
                        this.flipCard(this.selectedCard);
                        e.preventDefault();
                        break;
                }
                this.draw();
            }

            handleTouchStart(action) {
                if (!this.running) return;

                switch (action) {
                    case 'left':
                        this.selectedCard = Math.max(0, this.selectedCard - 1);
                        break;
                    case 'right':
                        this.selectedCard = Math.min(15, this.selectedCard + 1);
                        break;
                    case 'up':
                        this.selectedCard = Math.max(0, this.selectedCard - 4);
                        break;
                    case 'down':
                        this.selectedCard = Math.min(15, this.selectedCard + 4);
                        break;
                    case 'action':
                        this.flipCard(this.selectedCard);
                        break;
                }
                this.draw();
            }

            handleTouchEnd(action) {
                // No specific action needed for touch end in Memory game
            }

            handleResize() {
                this.draw();
            }

            gameWin() {
                this.running = false;

                this.ctx.fillStyle = 'rgba(0, 255, 0, 0.8)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                this.ctx.fillStyle = '#fff';
                this.ctx.font = `${Math.max(36, this.canvas.width / 15)}px Orbitron`;
                this.ctx.textAlign = 'center';
                this.ctx.shadowColor = '#fff';
                this.ctx.shadowBlur = 10;
                this.ctx.fillText('Memory MASTER!', this.canvas.width / 2, this.canvas.height / 2);
                this.ctx.font = `${Math.max(20, this.canvas.width / 25)}px Orbitron`;
                this.ctx.fillText(`Final Score: ${this.score}`, this.canvas.width / 2, this.canvas.height / 2 + 50);
                this.ctx.shadowBlur = 0;
            }
        }

        // Flappy Bird Game
        class FlappyBirdGame {
            constructor() {
                this.bird = { x: 100, y: 300, width: 30, height: 30, velocity: 0, gravity: 0.5, jump: -8 };
                this.pipes = [];
                this.score = 0;
                this.running = false;
                this.gameLoop = null;
                this.pipeWidth = 60;
                this.pipeGap = 150;
                this.pipeSpeed = 3;
                this.isMobile = false;
            }

            init() {
                this.bird = { 
                    x: this.canvas ? this.canvas.width * 0.2 : 100, 
                    y: this.canvas ? this.canvas.height / 2 : 300, 
                    width: this.canvas ? this.canvas.width * 0.05 : 30, 
                    height: this.canvas ? this.canvas.width * 0.05 : 30, 
                    velocity: 0, 
                    gravity: 0.5, 
                    jump: -8 
                };
                this.pipes = [];
                this.score = 0;
                this.running = false;
                this.generateInitialPipes();
                this.draw();
            }

            generateInitialPipes() {
                this.pipes = [];
                for (let i = 0; i < 3; i++) {
                    this.addPipe(this.canvas.width + i * 250);
                }
            }

            addPipe(x) {
                const minHeight = 50;
                const maxHeight = this.canvas.height - this.pipeGap - minHeight;
                const topHeight = minHeight + Math.random() * (maxHeight - minHeight);

                this.pipes.push({
                    x: x,
                    topHeight: topHeight,
                    bottomY: topHeight + this.pipeGap,
                    bottomHeight: this.canvas.height - (topHeight + this.pipeGap),
                    passed: false
                });
            }

            start() {
                if (this.running) return;
                this.running = true;
                this.gameLoop = setInterval(() => this.update(), 16);
            }

            pause() {
                if (!this.running) return;
                this.paused = !this.paused;

                if (this.paused) {
                    if (this.gameLoop) {
                        clearInterval(this.gameLoop);
                        this.gameLoop = null;
                    }
                    this.drawPauseScreen();
                    this.gameSystem.playSound('pause');
                } else {
                    this.gameLoop = setInterval(() => this.update(), 16);
                    this.gameSystem.playSound('resume');
                }
            }

            drawPauseScreen() {
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                this.ctx.fillStyle = '#00ff99';
                this.ctx.font = `${Math.max(32, this.canvas.width / 15)}px Orbitron`;
                this.ctx.textAlign = 'center';
                this.ctx.shadowColor = '#00ff99';
                this.ctx.shadowBlur = 10;
                this.ctx.fillText('PAUSED', this.canvas.width / 2, this.canvas.height / 2);
                this.ctx.font = `${Math.max(16, this.canvas.width / 30)}px Orbitron`;
                this.ctx.fillText('Press Pause to continue', this.canvas.width / 2, this.canvas.height / 2 + 50);
                this.ctx.shadowBlur = 0;
            }

            restart() {
                this.pause();
                this.init();
            }

            stop() {
                this.pause();
            }

            update() {
                if (!this.running) return;

                // Update bird physics
                this.bird.velocity += this.bird.gravity;
                this.bird.y += this.bird.velocity;

                // Check ground and ceiling collision
                if (this.bird.y <= 0 || this.bird.y >= this.canvas.height - this.bird.height) {
                    this.gameOver();
                    return;
                }

                // Update pipes
                for (let i = this.pipes.length - 1; i >= 0; i--) {
                    const pipe = this.pipes[i];
                    pipe.x -= this.pipeSpeed;

                    // Check if bird passed pipe
                    if (!pipe.passed && pipe.x + this.pipeWidth < this.bird.x) {
                        pipe.passed = true;
                        this.score++;
                        this.gameSystem.updateScore(this.score);
                    }

                    // Remove pipes that are off screen
                    if (pipe.x + this.pipeWidth < 0) {
                        this.pipes.splice(i, 1);
                    }

                    // Check collision with pipe
                    if (this.checkPipeCollision(pipe)) {
                        this.gameOver();
                        return;
                    }
                }

                // Add new pipes
                if (this.pipes.length > 0 && this.pipes[this.pipes.length - 1].x < this.canvas.width - 250) {
                    this.addPipe(this.canvas.width);
                }

                this.draw();
            }

            checkPipeCollision(pipe) {
                // Check if bird is within pipe x range
                if (this.bird.x + this.bird.width > pipe.x && this.bird.x < pipe.x + this.pipeWidth) {
                    // Check if bird hits top or bottom pipe
                    if (this.bird.y < pipe.topHeight || this.bird.y + this.bird.height > pipe.bottomY) {
                        return true;
                    }
                }
                return false;
            }

            jump() {
                if (this.running) {
                    this.bird.velocity = this.bird.jump;
                    this.gameSystem.playSound('move');
                }
            }

            draw() {
                // Sky gradient background
                const gradient = this.ctx.createLinearGradient(0, 0, 0, this.canvas.height);
                gradient.addColorStop(0, '#001122');
                gradient.addColorStop(1, '#00ff99');
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // Draw clouds
                this.ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                const cloudCount = Math.max(3, Math.floor(this.canvas.width / 200));
                for (let i = 0; i < cloudCount; i++) {
                    const x = (i * 200 + Date.now() * 0.02) % (this.canvas.width + 100);
                    const y = 50 + i * 30;
                    this.ctx.beginPath();
                    this.ctx.arc(x, y, 30, 0, Math.PI * 2);
                    this.ctx.arc(x + 25, y, 35, 0, Math.PI * 2);
                    this.ctx.arc(x + 50, y, 30, 0, Math.PI * 2);
                    this.ctx.fill();
                }

                // Draw pipes
                this.ctx.shadowBlur = 10;
                this.pipes.forEach(pipe => {
                    // Top pipe
                    this.ctx.fillStyle = '#00ff00';
                    this.ctx.shadowColor = '#00ff00';
                    this.ctx.fillRect(pipe.x, 0, this.pipeWidth, pipe.topHeight);

                    // Bottom pipe
                    this.ctx.fillRect(pipe.x, pipe.bottomY, this.pipeWidth, pipe.bottomHeight);

                    // Pipe caps
                    this.ctx.fillStyle = '#00aa00';
                    this.ctx.fillRect(pipe.x - 5, pipe.topHeight - 20, this.pipeWidth + 10, 20);
                    this.ctx.fillRect(pipe.x - 5, pipe.bottomY, this.pipeWidth + 10, 20);
                });

                // Draw bird
                this.ctx.fillStyle = '#ffff00';
                this.ctx.shadowColor = '#ffff00';
                this.ctx.shadowBlur = 15;

                // Bird body
                this.ctx.beginPath();
                this.ctx.arc(this.bird.x + this.bird.width / 2, this.bird.y + this.bird.height / 2, this.bird.width / 2, 0, Math.PI * 2);
                this.ctx.fill();

                // Bird wing
                this.ctx.fillStyle = '#ffaa00';
                this.ctx.beginPath();
                this.ctx.ellipse(this.bird.x + this.bird.width / 2 - 5, this.bird.y + this.bird.height / 2, 8, 4, Math.sin(Date.now() * 0.01) * 0.3, 0, Math.PI * 2);
                this.ctx.fill();

                // Bird eye
                this.ctx.fillStyle = '#000';
                this.ctx.shadowBlur = 0;
                this.ctx.beginPath();
                this.ctx.arc(this.bird.x + this.bird.width / 2 + 5, this.bird.y + this.bird.height / 2 - 5, 3, 0, Math.PI * 2);
                this.ctx.fill();

                // Draw ground
                this.ctx.fillStyle = '#228B22';
                this.ctx.shadowColor = '#228B22';
                this.ctx.shadowBlur = 5;
                this.ctx.fillRect(0, this.canvas.height - 20, this.canvas.width, 20);

                // Draw score
                this.ctx.fillStyle = '#fff';
                this.ctx.font = `${Math.max(36, this.canvas.width / 15)}px Orbitron`;
                this.ctx.textAlign = 'center';
                this.ctx.shadowColor = '#000';
                this.ctx.shadowBlur = 5;
                this.ctx.fillText(this.score, this.canvas.width / 2, 60);

                // Draw instructions
                if (!this.running) {
                    this.ctx.font = `${Math.max(16, this.canvas.width / 40)}px Orbitron`;
                    this.ctx.fillText('Press SPACE or click to flap!', this.canvas.width / 2, this.canvas.height / 2 + 100);
                }

                this.ctx.shadowBlur = 0;
            }

            handleKeyDown(e) {
                if (e.key === ' ') {
                    this.jump();
                    e.preventDefault();
                }
            }

            handleCanvasClick(e) {
                this.jump();
            }

            handleTouchStart(action) {
                if (action === 'action' || action === 'up') {
                    this.jump();
                }
            }

            handleTouchEnd(action) {
                // No specific action needed for touch end in Flappy Bird game
            }

            handleResize() {
                // Adjust bird position if it's outside the new canvas bounds
                if (this.bird.y > this.canvas.height - this.bird.height) {
                    this.bird.y = this.canvas.height - this.bird.height;
                }
                this.draw();
            }

            gameOver() {
                this.running = false;
                clearInterval(this.gameLoop);

                this.ctx.fillStyle = 'rgba(255, 0, 102, 0.8)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                this.ctx.fillStyle = '#fff';
                this.ctx.font = `${Math.max(36, this.canvas.width / 15)}px Orbitron`;
                this.ctx.textAlign = 'center';
                this.ctx.shadowColor = '#000';
                this.ctx.shadowBlur = 10;
                this.ctx.fillText('GAME OVER', this.canvas.width / 2, this.canvas.height / 2);
                this.ctx.font = `${Math.max(20, this.canvas.width / 25)}px Orbitron`;
                this.ctx.fillText(`Score: ${this.score}`, this.canvas.width / 2, this.canvas.height / 2 + 50);
                this.ctx.fillText('Click Restart to try again!', this.canvas.width / 2, this.canvas.height / 2 + 80);
                this.ctx.shadowBlur = 0;
            }
        }

        // Initialize the game system
        let gameSystem;

        document.addEventListener('DOMContentLoaded', () => {
            gameSystem = new GameSystem();

            // Add click sound to all buttons
            document.addEventListener('click', (e) => {
                if (e.target.tagName === 'BUTTON' || e.target.classList.contains('game-card')) {
                    gameSystem.playSound('click');
                }
            });
        });

        // Handle first user interaction for audio
        document.addEventListener('click', function enableAudio() {
            gameSystem.playBackgroundMusic();
            document.removeEventListener('click', enableAudio);
        }, { once: true });
    </script>
