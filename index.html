            setupEventListeners() {
                // Search functionality
                document.getElementById('searchBar').addEventListener('input', (e) => {
                    this.filterGames(e.target.value);
                });

                // Category filters
                document.querySelectorAll('.category-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.filterByCategory(e.target.dataset.category);
                    });
                });

                // Music toggle
                document.getElementById('musicToggle').addEventListener('click', () => {
                    this.toggleMusic();
                });

                // Theme toggle
                document.getElementById('themeToggle').addEventListener('click', () => {
                    this.toggleTheme();
                });

                // Game controls
                document.getElementById('closeGame').addEventListener('click', () => {
                    this.closeGame();
                });

                document.getElementById('startGame').addEventListener('click', () => {
                    if (this.currentGame) this.currentGame.start();
                });

                document.getElementById('restartGame').addEventListener('click', () => {
                    if (this.currentGame) this.currentGame.restart();
                });

                document.getElementById('pauseGame').addEventListener('click', () => {
                    if (this.currentGame) this.currentGame.pause();
                });

                // Keyboard controls
                document.addEventListener('keydown', (e) => {
                    if (this.currentGame && this.currentGame.handleKeyDown) {
                        this.currentGame.handleKeyDown(e);
                    }
                });

                document.addEventListener('keyup', (e) => {
                    if (this.currentGame && this.currentGame.handleKeyUp) {
                        this.currentGame.handleKeyUp(e);
                    }
                });

                // Mouse controls for canvas
                this.canvas.addEventListener('click', (e) => {
                    if (this.currentGame && this.currentGame.handleCanvasClick) {
                        this.currentGame.handleCanvasClick(e);
                    }
                });

                // Handle window resize
                window.addEventListener('resize', () => {
                    if (this.currentGame) {
                        this.resizeCanvas();
                        if (this.currentGame.handleResize) {
                            this.currentGame.handleResize();
                        }
                    }
                });
            }

            setupTouchControls() {
                if (!this.isMobile) {
                    document.getElementById('touchControls').style.display = 'none';
                    return;
                }

                const touchButtons = {
                    'touchLeft': 'left',
                    'touchRight': 'right',
                    'touchUp': 'up',
                    'touchDown': 'down',
                    'touchAction': 'action'
                };

                Object.entries(touchButtons).forEach(([id, action]) => {
                    const element = document.getElementById(id);
                    
                    element.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        this.touchControls[action] = true;
                        if (this.currentGame && this.currentGame.handleTouchStart) {
                            this.currentGame.handleTouchStart(action);
                        }
                    });
                    
                    element.addEventListener('touchend', (e) => {
                        e.preventDefault();
                        this.touchControls[action] = false;
                        if (this.currentGame && this.currentGame.handleTouchEnd) {
                            this.currentGame.handleTouchEnd(action);
                        }
                    });
                    
                    // Also handle mouse events for testing on desktop
                    element.addEventListener('mousedown', (e) => {
                        e.preventDefault();
                        this.touchControls[action] = true;
                        if (this.currentGame && this.currentGame.handleTouchStart) {
                            this.currentGame.handleTouchStart(action);
                        }
                    });
                    
                    element.addEventListener('mouseup', (e) => {
                        e.preventDefault();
                        this.touchControls[action] = false;
                        if (this.currentGame && this.currentGame.handleTouchEnd) {
                            this.currentGame.handleTouchEnd(action);
                        }
                    });
                });
            }

            renderGames() {
                const gamesGrid = document.getElementById('gamesGrid');
                const floatingLauncher = document.getElementById('floatingLauncher');

                gamesGrid.innerHTML = '';
                floatingLauncher.innerHTML = '';

                this.games.forEach(game => {
                    // Game card
                    const gameCard = document.createElement('div');
                    gameCard.className = 'game-card fade-in';
                    gameCard.innerHTML = `
                        <span class="game-icon">${game.icon}</span>
                        <h3 class="game-title">${game.title}</h3>
                        <p class="game-description">${game.description}</p>
                        <button class="play-btn" onclick="gameSystem.openGame('${game.id}')">Play Now</button>
                    `;
                    gamesGrid.appendChild(gameCard);

                    // Launcher icon
                    const launcherIcon = document.createElement('div');
                    launcherIcon.className = 'launcher-icon';
                    launcherIcon.innerHTML = game.icon;
                    launcherIcon.title = game.title;
                    launcherIcon.onclick = () => this.openGame(game.id);
                    floatingLauncher.appendChild(launcherIcon);
                });
            }

            filterGames(searchTerm) {
                const gameCards = document.querySelectorAll('.game-card');
                gameCards.forEach((card, index) => {
                    const title = this.games[index].title.toLowerCase();
                    const description = this.games[index].description.toLowerCase();
                    const matches = title.includes(searchTerm.toLowerCase()) ||
                        description.includes(searchTerm.toLowerCase());
                    card.style.display = matches ? 'block' : 'none';
                });
            }

            filterByCategory(category) {
                const gameCards = document.querySelectorAll('.game-card');
                gameCards.forEach((card, index) => {
                    const gameCategory = this.games[index].category;
                    const matches = category === 'all' || gameCategory === category;
                    card.style.display = matches ? 'block' : 'none';
                });
            }

            openGame(gameId) {
                const game = this.games.find(g => g.id === gameId);
                if (!game) return;

                this.currentGame = game.game;
                this.currentGame.canvas = this.canvas;
                this.currentGame.ctx = this.ctx;
                this.currentGame.gameSystem = this;
                this.currentGame.isMobile = this.isMobile;

                document.getElementById('currentGameTitle').textContent = game.title;
                this.gameModal.style.display = 'flex';
                
                // Resize canvas for the current game
                this.resizeCanvas();

                // Initialize game
                if (this.currentGame.init) {
                    this.currentGame.init();
                }

                this.playSound('gameStart');
            }

            resizeCanvas() {
                const container = document.querySelector('.game-canvas-container');
                const maxWidth = container.clientWidth;
                const maxHeight = window.innerHeight * 0.6;
                
                // Set default canvas size based on game type
                let defaultWidth = 800;
                let defaultHeight = 600;
                
                // Adjust default sizes for different games
                if (this.currentGame instanceof SnakeGame) {
                    defaultWidth = 600;
                    defaultHeight = 450;
                } else if (this.currentGame instanceof TetrisGame) {
                    defaultWidth = 600;
                    defaultHeight = 600;
                } else if (this.currentGame instanceof MemoryGame) {
                    defaultWidth = 500;
                    defaultHeight = 500;
                }
                
                // Calculate aspect ratio
                const aspectRatio = defaultWidth / defaultHeight;
                
                // Calculate new dimensions
                let newWidth = defaultWidth;
                let newHeight = defaultHeight;
                
                if (newWidth > maxWidth) {
                    newWidth = maxWidth;
                    newHeight = newWidth / aspectRatio;
                }
                
                if (newHeight > maxHeight) {
                    newHeight = maxHeight;
                    newWidth = newHeight * aspectRatio;
                }
                
                // Set canvas dimensions
                this.canvas.width = newWidth;
                this.canvas.height = newHeight;
                this.canvas.style.width = newWidth + 'px';
                this.canvas.style.height = newHeight + 'px';
            }

            closeGame() {
                if (this.currentGame && this.currentGame.stop) {
                    this.currentGame.stop();
                }
                this.currentGame = null;
                this.gameModal.style.display = 'none';
                this.playSound('gameEnd');
            }

            updateScore(score) {
                document.getElementById('scoreDisplay').textContent = `Score: ${score}`;

                // Update high score
                if (this.currentGame) {
                    const gameId = this.games.find(g => g.game === this.currentGame)?.id;
                    if (gameId && (!this.highScores[gameId] || score > this.highScores[gameId])) {
                        this.highScores[gameId] = score;
                        localStorage.setItem('highScores', JSON.stringify(this.highScores));
                        this.updateProfile();
                    }
                }
            }

            updateProfile() {
                document.getElementById('playerName').textContent = `Player: ${this.playerName}`;
                const highScoresDiv = document.getElementById('highScores');
                highScoresDiv.innerHTML = Object.entries(this.highScores)
                    .map(([game, score]) => `<div>${game}: ${score}</div>`)
                    .join('');
            }

            toggleMusic() {
                const music = document.getElementById('backgroundMusic');
                const btn = document.getElementById('musicToggle');

                if (this.musicEnabled) {
                    music.pause();
                    btn.textContent = '🔇 Music';
                    this.musicEnabled = false;
                } else {
                    music.play();
                    btn.textContent = '🎵 Music';
                    this.musicEnabled = true;
                }
            }

            toggleTheme() {
                const body = document.body;
                const btn = document.getElementById('themeToggle');

                if (body.classList.contains('light-theme')) {
                    // Switch to dark theme
                    body.classList.remove('light-theme');
                    btn.textContent = '🌙 Dark';
                    this.playSound('click');
                } else {
                    // Switch to light theme
                    body.classList.add('light-theme');
                    btn.textContent = '☀️ Light';
                    this.playSound('click');
                }
            }

            playBackgroundMusic() {
                const music = document.getElementById('backgroundMusic');
                music.volume = 0.3;
                if (this.musicEnabled) {
                    music.play().catch(() => {
                        // Auto-play blocked, will play on first user interaction
                    });
                }
            }

            playSound(type) {
                if (!this.soundEnabled) return;

                try {
                    // Create simple sound effects using Web Audio API
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();

                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);

                    let frequency = 440;
                    let duration = 0.1;
                    let volume = 0.1;

                    switch (type) {
                        case 'click':
                            frequency = 800;
                            duration = 0.05;
                            break;
                        case 'gameStart':
                            frequency = 523; // C5
                            duration = 0.3;
                            volume = 0.15;
                            break;
                        case 'gameEnd':
                        case 'gameOver':
                            frequency = 220; // A3
                            duration = 0.5;
                            volume = 0.2;
                            break;
                        case 'pause':
                            frequency = 659; // E5
                            duration = 0.2;
                            break;
                        case 'resume':
                            frequency = 784; // G5
                            duration = 0.2;
                            break;
                        case 'restart':
                            frequency = 440; // A4
                            duration = 0.25;
                            break;
                        case 'move':
                            frequency = 1000;
                            duration = 0.03;
                            volume = 0.05;
                            break;
                        case 'eat':
                            frequency = 1200;
                            duration = 0.1;
                            volume = 0.12;
                            break;
                        case 'rotate':
                            frequency = 880;
                            duration = 0.08;
                            volume = 0.08;
                            break;
                        case 'lineClear':
                            frequency = 1320; // E6
                            duration = 0.4;
                            volume = 0.18;
                            break;
                        case 'pieceLand':
                            frequency = 330;
                            duration = 0.06;
                            volume = 0.06;
                            break;
                        case 'softDrop':
                            frequency = 600;
                            duration = 0.04;
                            volume = 0.04;
                            break;
                        case 'hardDrop':
                            frequency = 400;
                            duration = 0.15;
                            volume = 0.1;
                            break;
                        case 'shoot':
                            frequency = 1500;
                            duration = 0.05;
                            volume = 0.08;
                            break;
                        case 'hit':
                            frequency = 200;
                            duration = 0.1;
                            volume = 0.12;
                            break;
                        case 'powerup':
                            frequency = 1760; // A6
                            duration = 0.3;
                            volume = 0.15;
                            break;
                    }

                    oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
                    oscillator.type = 'square'; // Retro sound

                    gainNode.gain.setValueAtTime(volume, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + duration);

                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + duration);
                } catch (error) {
                    // Silently fail if Web Audio API is not supported
                    console.log('Audio not supported');
                }
            }
        }

        // Snake Game
        class SnakeGame {
            constructor() {
                this.snake = [{ x: 10, y: 10 }];
                this.food = { x: 15, y: 15 };
                this.dx = 0;
                this.dy = 0;
                this.score = 0;
                this.running = false;
                this.paused = false;
                this.gameLoop = null;
                this.gridWidth = 40;
                this.gridHeight = 30;
                this.nextDirection = null;
                this.isMobile = false;
            }

            init() {
                this.snake = [{ x: 10, y: 10 }];
                this.food = this.generateFood();
                this.dx = 0;
                this.dy = 0;
                this.score = 0;
                this.running = false;
                this.paused = false;
                this.nextDirection = null;
                this.draw();
            }

            start() {
                if (this.running && !this.paused) return;
                this.running = true;
                this.paused = false;
                // Start moving right automatically
                this.dx = 1;
                this.dy = 0;
                this.gameLoop = setInterval(() => this.update(), 150);
                this.gameSystem.playSound('gameStart');
            }

            pause() {
                if (!this.running) return;
                this.paused = !this.paused;

                if (this.paused) {
                    if (this.gameLoop) {
                        clearInterval(this.gameLoop);
                        this.gameLoop = null;
                    }
                    this.drawPauseScreen();
                    this.gameSystem.playSound('pause');
                } else {
                    this.gameLoop = setInterval(() => this.update(), 150);
                    this.gameSystem.playSound('resume');
                }
            }

            drawPauseScreen() {
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                this.ctx.fillStyle = '#00ff99';
                this.ctx.font = `${Math.max(24, this.canvas.width / 20)}px Orbitron`;
                this.ctx.textAlign = 'center';
                this.ctx.shadowColor = '#00ff99';
                this.ctx.shadowBlur = 10;
                this.ctx.fillText('PAUSED', this.canvas.width / 2, this.canvas.height / 2);
                this.ctx.font = `${Math.max(14, this.canvas.width / 30)}px Orbitron`;
                this.ctx.fillText('Press Pause to continue', this.canvas.width / 2, this.canvas.height / 2 + 50);
                this.ctx.shadowBlur = 0;
            }

            restart() {
                this.pause();
                this.init();
            }

            stop() {
                this.pause();
            }

            update() {
                if (!this.running || this.paused) return;

                // Apply queued direction change
                if (this.nextDirection) {
                    this.dx = this.nextDirection.dx;
                    this.dy = this.nextDirection.dy;
                    this.nextDirection = null;
                }

                const head = { x: this.snake[0].x + this.dx, y: this.snake[0].y + this.dy };

                // Check wall collision
                if (head.x < 0 || head.x >= this.gridWidth || head.y < 0 || head.y >= this.gridHeight) {
                    this.gameOver();
                    return;
                }

                // Check self collision
                if (this.snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                    this.gameOver();
                    return;
                }

                this.snake.unshift(head);

                // Check food collision
                if (head.x === this.food.x && head.y === this.food.y) {
                    this.score += 10;
                    this.gameSystem.updateScore(this.score);
                    this.gameSystem.playSound('eat');
                    this.food = this.generateFood();
                } else {
                    this.snake.pop();
                }

                this.draw();
            }

            generateFood() {
                let food;
                do {
                    food = {
                        x: Math.floor(Math.random() * this.gridWidth),
                        y: Math.floor(Math.random() * this.gridHeight)
                    };
                } while (this.snake.some(segment => segment.x === food.x && segment.y === food.y));
                return food;
            }

            draw() {
                this.ctx.fillStyle = '#000';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // Calculate cell size based on canvas dimensions
                const cellSize = Math.min(
                    this.canvas.width / this.gridWidth,
                    this.canvas.height / this.gridHeight
                );

                // Draw grid lines
                this.ctx.strokeStyle = '#111';
                this.ctx.lineWidth = 1;
                for (let x = 0; x <= this.gridWidth; x++) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(x * cellSize, 0);
                    this.ctx.lineTo(x * cellSize, this.gridHeight * cellSize);
                    this.ctx.stroke();
                }
                for (let y = 0; y <= this.gridHeight; y++) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, y * cellSize);
                    this.ctx.lineTo(this.gridWidth * cellSize, y * cellSize);
                    this.ctx.stroke();
                }

                // Draw snake
                this.ctx.shadowBlur = 10;
                this.snake.forEach((segment, index) => {
                    if (index === 0) {
                        // Head
                        this.ctx.fillStyle = '#00ff99';
                        this.ctx.shadowColor = '#00ff99';
                    } else {
                        // Body
                        this.ctx.fillStyle = '#0088aa';
                        this.ctx.shadowColor = '#0088aa';
                    }
                    this.ctx.fillRect(
                        segment.x * cellSize + 1,
                        segment.y * cellSize + 1,
                        cellSize - 2,
                        cellSize - 2
                    );
                });

                // Draw food
                this.ctx.fillStyle = '#003366';
                this.ctx.shadowColor = '#003366';
                this.ctx.fillRect(
                    this.food.x * cellSize + 1,
                    this.food.y * cellSize + 1,
                    cellSize - 2,
                    cellSize - 2
                );

                this.ctx.shadowBlur = 0;
            }

            handleKeyDown(e) {
                if (!this.running) return;

                // Queue direction changes to prevent rapid key presses causing issues
                if (!this.paused) {
                    switch (e.key) {
                        case 'ArrowUp':
                            if (this.dy !== 1) { // Can't go opposite direction
                                this.nextDirection = { dx: 0, dy: -1 };
                                this.gameSystem.playSound('move');
                            }
                            break;
                        case 'ArrowDown':
                            if (this.dy !== -1) {
                                this.nextDirection = { dx: 0, dy: 1 };
                                this.gameSystem.playSound('move');
                            }
                            break;
                        case 'ArrowLeft':
                            if (this.dx !== 1) {
                                this.nextDirection = { dx: -1, dy: 0 };
                                this.gameSystem.playSound('move');
                            }
                            break;
                        case 'ArrowRight':
                            if (this.dx !== -1) {
                                this.nextDirection = { dx: 1, dy: 0 };
                                this.gameSystem.playSound('move');
                            }
                            break;
                    }
                }
                e.preventDefault();
            }

            handleTouchStart(action) {
                if (!this.running || this.paused) return;

                switch (action) {
                    case 'up':
                        if (this.dy !== 1) {
                            this.nextDirection = { dx: 0, dy: -1 };
                            this.gameSystem.playSound('move');
                        }
                        break;
                    case 'down':
                        if (this.dy !== -1) {
                            this.nextDirection = { dx: 0, dy: 1 };
                            this.gameSystem.playSound('move');
                        }
                        break;
                    case 'left':
                        if (this.dx !== 1) {
                            this.nextDirection = { dx: -1, dy: 0 };
                            this.gameSystem.playSound('move');
                        }
                        break;
                    case 'right':
                        if (this.dx !== -1) {
                            this.nextDirection = { dx: 1, dy: 0 };
                            this.gameSystem.playSound('move');
                        }
                        break;
                }
            }

            handleTouchEnd(action) {
                // No specific action needed for touch end in Snake game
            }

            handleResize() {
                this.draw();
            }

            gameOver() {
                this.running = false;
                clearInterval(this.gameLoop);

                this.ctx.fillStyle = 'rgba(255, 0, 102, 0.8)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                this.ctx.fillStyle = '#fff';
                this.ctx.font = `${Math.max(32, this.canvas.width / 15)}px Orbitron`;
                this.ctx.textAlign = 'center';
                this.ctx.shadowColor = '#fff';
                this.ctx.shadowBlur = 10;
                this.ctx.fillText('GAME OVER', this.canvas.width / 2, this.canvas.height / 2);
                this.ctx.font = `${Math.max(18, this.canvas.width / 25)}px Orbitron`;
                this.ctx.fillText(`Score: ${this.score}`, this.canvas.width / 2, this.canvas.height / 2 + 50);
                this.ctx.fillText(`Length: ${this.snake.length}`, this.canvas.width / 2, this.canvas.height / 2 + 80);
                this.ctx.shadowBlur = 0;
            }
        }

        // Coin Collector Car Game
        class TetrisGame {
            constructor() {
                this.car = { x: 375, y: 500, width: 50, height: 80, speed: 5 };
                this.coins = [];
                this.obstacles = [];
                this.score = 0;
                this.running = false;
                this.paused = false;
                this.gameLoop = null;
                this.keys = {};
                this.roadOffset = 0;
                this.gameSpeed = 2;
                this.coinSpawnTimer = 0;
                this.obstacleSpawnTimer = 0;
                this.level = 1;
                this.coinsCollected = 0;
                this.isMobile = false;
            }

            init() {
                // Adjust car position based on canvas size
                this.car = { 
                    x: this.canvas ? this.canvas.width / 2 - 25 : 375, 
                    y: this.canvas ? this.canvas.height - 100 : 500, 
                    width: 50, 
                    height: 80, 
                    speed: 5 
                };
                this.coins = [];
                this.obstacles = [];
                this.score = 0;
                this.running = false;
                this.paused = false;
                this.keys = {};
                this.roadOffset = 0;
                this.gameSpeed = 2;
                this.coinSpawnTimer = 0;
                this.obstacleSpawnTimer = 0;
                this.level = 1;
                this.coinsCollected = 0;
                this.draw();
            }

            start() {
                if (this.running && !this.paused) return;
                this.running = true;
                this.paused = false;
                this.gameLoop = setInterval(() => this.update(), 16);
                this.gameSystem.playSound('gameStart');
            }

            pause() {
                if (!this.running) return;
                this.paused = !this.paused;

                if (this.paused) {
                    if (this.gameLoop) {
                        clearInterval(this.gameLoop);
                        this.gameLoop = null;
                    }
                    this.drawPauseScreen();
                    this.gameSystem.playSound('pause');
                } else {
                    this.gameLoop = setInterval(() => this.update(), 16);
                    this.gameSystem.playSound('resume');
                }
            }

            restart() {
                this.stop();
                this.init();
                this.gameSystem.playSound('restart');
            }

            stop() {
                this.running = false;
                this.paused = false;
                if (this.gameLoop) {
                    clearInterval(this.gameLoop);
                    this.gameLoop = null;
                }
            }

            update() {
                if (!this.running || this.paused) return;

                // Move car based on keys or touch controls
                if (this.keys['ArrowLeft'] || this.gameSystem.touchControls.left) {
                    if (this.car.x > this.canvas.width * 0.3) {
                        this.car.x -= this.car.speed;
                    }
                }
                if (this.keys['ArrowRight'] || this.gameSystem.touchControls.right) {
                    if (this.car.x < this.canvas.width * 0.7 - this.car.width) {
                        this.car.x += this.car.speed;
                    }
                }
                if (this.keys['ArrowUp'] || this.gameSystem.touchControls.up) {
                    if (this.car.y > 50) {
                        this.car.y -= this.car.speed;
                    }
                }
                if (this.keys['ArrowDown'] || this.gameSystem.touchControls.down) {
                    if (this.car.y < this.canvas.height - this.car.height - 20) {
                        this.car.y += this.car.speed;
                    }
                }

                // Update road animation
                this.roadOffset += this.gameSpeed;
                if (this.roadOffset > 40) {
                    this.roadOffset = 0;
                }

                // Spawn coins
                this.coinSpawnTimer++;
                if (this.coinSpawnTimer > 60) { // Spawn every 60 frames
                    this.spawnCoin();
                    this.coinSpawnTimer = 0;
                }

                // Spawn obstacles
                this.obstacleSpawnTimer++;
                if (this.obstacleSpawnTimer > 120) { // Spawn every 120 frames
                    this.spawnObstacle();
                    this.obstacleSpawnTimer = 0;
                }

                // Update coins
                this.coins = this.coins.filter(coin => {
                    coin.y += this.gameSpeed + 2;

                    // Check collision with car
                    if (this.isColliding(this.car, coin)) {
                        this.collectCoin();
                        this.gameSystem.playSound('eat');
                        return false; // Remove coin
                    }

                    return coin.y < this.canvas.height + 50; // Keep if still on screen
                });

                // Update obstacles
                this.obstacles = this.obstacles.filter(obstacle => {
                    obstacle.y += this.gameSpeed + 1;

                    // Check collision with car
                    if (this.isColliding(this.car, obstacle)) {
                        this.gameOver();
                        return false;
                    }

                    return obstacle.y < this.canvas.height + 50; // Keep if still on screen
                });

                // Level progression
                if (this.coinsCollected > 0 && this.coinsCollected % 20 === 0 && this.coinsCollected !== this.lastLevelUp) {
                    this.levelUp();
                    this.lastLevelUp = this.coinsCollected;
                }

                this.draw();
            }

            spawnCoin() {
                const roadLeft = this.canvas.width * 0.3;
                const roadRight = this.canvas.width * 0.7;
                const roadWidth = roadRight - roadLeft;
                const laneWidth = roadWidth / 4;
                const lanes = [
                    roadLeft + laneWidth * 0.5,
                    roadLeft + laneWidth * 1.5,
                    roadLeft + laneWidth * 2.5,
                    roadLeft + laneWidth * 3.5
                ];
                const lane = lanes[Math.floor(Math.random() * lanes.length)];

                this.coins.push({
                    x: lane,
                    y: -30,
                    width: 25,
                    height: 25,
                    rotation: 0
                });
            }

            spawnObstacle() {
                const roadLeft = this.canvas.width * 0.3;
                const roadRight = this.canvas.width * 0.7;
                const roadWidth = roadRight - roadLeft;
                const laneWidth = roadWidth / 4;
                const lanes = [
                    roadLeft + laneWidth * 0.5,
                    roadLeft + laneWidth * 1.5,
                    roadLeft + laneWidth * 2.5,
                    roadLeft + laneWidth * 3.5
                ];
                const lane = lanes[Math.floor(Math.random() * lanes.length)];

                this.obstacles.push({
                    x: lane - 15,
                    y: -50,
                    width: 40,
                    height: 60,
                    type: Math.random() > 0.5 ? 'car' : 'barrier'
                });
            }

            collectCoin() {
                this.coinsCollected++;
                this.score += 10 * this.level;
                this.gameSystem.updateScore(this.score);
            }

            levelUp() {
                this.level++;
                this.gameSpeed += 0.5;
                this.car.speed += 0.5;
                this.score += 100;
                this.gameSystem.updateScore(this.score);
                this.gameSystem.playSound('powerup');
            }

            isColliding(rect1, rect2) {
                return rect1.x < rect2.x + rect2.width &&
                    rect1.x + rect1.width > rect2.x &&
                    rect1.y < rect2.y + rect2.height &&
                    rect1.y + rect1.height > rect2.y;
            }

            draw() {
                // Sky gradient
                const gradient = this.ctx.createLinearGradient(0, 0, 0, this.canvas.height);
                gradient.addColorStop(0, '#87CEEB');
                gradient.addColorStop(1, '#98FB98');
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // Draw grass on sides
                this.ctx.fillStyle = '#228B22';
                this.ctx.fillRect(0, 0, this.canvas.width * 0.3, this.canvas.height);
                this.ctx.fillRect(this.canvas.width * 0.7, 0, this.canvas.width * 0.3, this.canvas.height);

                // Draw road
                this.ctx.fillStyle = '#333';
                this.ctx.fillRect(this.canvas.width * 0.3, 0, this.canvas.width * 0.4, this.canvas.height);

                // Draw road markings
                this.ctx.fillStyle = '#fff';
                this.ctx.fillRect(this.canvas.width * 0.3 - 2, 0, 4, this.canvas.height); // Left edge
                this.ctx.fillRect(this.canvas.width * 0.7 - 2, 0, 4, this.canvas.height); // Right edge

                // Draw lane dividers (animated)
                this.ctx.fillStyle = '#ffff00';
                const roadLeft = this.canvas.width * 0.3;
                const roadWidth = this.canvas.width * 0.4;
                const laneWidth = roadWidth / 4;
                
                for (let i = 0; i < 3; i++) {
                    const x = roadLeft + laneWidth * (i + 1);
                    for (let y = -this.roadOffset; y < this.canvas.height + 40; y += 40) {
                        this.ctx.fillRect(x - 2, y, 4, 20);
                    }
                }

                // Draw trees on sides
                this.ctx.fillStyle = '#8B4513';
                const treeCount = Math.max(5, Math.floor(this.canvas.width / 100));
                for (let i = 0; i < treeCount; i++) {
                    const treeY = i * (this.canvas.height / treeCount) + (this.roadOffset % (this.canvas.height / treeCount));
                    // Left side trees
                    this.ctx.fillRect(50, treeY, 15, 40);
                    this.ctx.fillRect(150, treeY + 20, 15, 40);
                    // Right side trees
                    this.ctx.fillRect(this.canvas.width - 150, treeY + 10, 15, 40);
                    this.ctx.fillRect(this.canvas.width - 50, treeY + 30, 15, 40);
                }

                this.ctx.fillStyle = '#228B22';
                for (let i = 0; i < treeCount; i++) {
                    const treeY = i * (this.canvas.height / treeCount) + (this.roadOffset % (this.canvas.height / treeCount));
                    // Tree tops
                    this.ctx.beginPath();
                    this.ctx.arc(57, treeY - 10, 25, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.beginPath();
                    this.ctx.arc(157, treeY + 10, 25, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.beginPath();
                    this.ctx.arc(this.canvas.width - 143, treeY, 25, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.beginPath();
                    this.ctx.arc(this.canvas.width - 43, treeY + 20, 25, 0, Math.PI * 2);
                    this.ctx.fill();
                }

                // Draw coins
                this.ctx.shadowBlur = 10;
                this.coins.forEach(coin => {
                    coin.rotation += 0.1;

                    this.ctx.save();
                    this.ctx.translate(coin.x + coin.width / 2, coin.y + coin.height / 2);
                    this.ctx.rotate(coin.rotation);

                    // Coin outer ring
                    this.ctx.fillStyle = '#FFD700';
                    this.ctx.shadowColor = '#FFD700';
                    this.ctx.beginPath();
                    this.ctx.arc(0, 0, coin.width / 2, 0, Math.PI * 2);
                    this.ctx.fill();

                    // Coin inner circle
                    this.ctx.fillStyle = '#FFA500';
                    this.ctx.shadowBlur = 5;
                    this.ctx.beginPath();
                    this.ctx.arc(0, 0, coin.width / 2 - 3, 0, Math.PI * 2);
                    this.ctx.fill();

                    // Dollar sign
                    this.ctx.fillStyle = '#FFD700';
                    this.ctx.font = '16px Arial';
                    this.ctx.textAlign = 'center';
                    this.ctx.shadowBlur = 0;
                    this.ctx.fillText('$', 0, 5);

                    this.ctx.restore();
                });

                // Draw obstacles
                this.obstacles.forEach(obstacle => {
                    if (obstacle.type === 'car') {
                        // Enemy car
                        this.ctx.fillStyle = '#ff0066';
                        this.ctx.shadowColor = '#ff0066';
                        this.ctx.shadowBlur = 8;
                        this.ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);

                        // Car details
                        this.ctx.fillStyle = '#000';
                        this.ctx.shadowBlur = 0;
                        this.ctx.fillRect(obstacle.x + 5, obstacle.y + 10, obstacle.width - 10, 15); // Windshield
                        this.ctx.fillRect(obstacle.x + 5, obstacle.y + 35, obstacle.width - 10, 15); // Rear window

                        // Headlights
                        this.ctx.fillStyle = '#fff';
                        this.ctx.fillRect(obstacle.x + 5, obstacle.y - 2, 8, 4);
                        this.ctx.fillRect(obstacle.x + obstacle.width - 13, obstacle.y - 2, 8, 4);
                    } else {
                        // Barrier
                        this.ctx.fillStyle = '#ff6600';
                        this.ctx.shadowColor = '#ff6600';
                        this.ctx.shadowBlur = 8;
                        this.ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);

                        // Barrier stripes
                        this.ctx.fillStyle = '#fff';
                        this.ctx.shadowBlur = 0;
                        for (let i = 0; i < 3; i++) {
                            this.ctx.fillRect(obstacle.x + 5, obstacle.y + i * 20 + 5, obstacle.width - 10, 3);
                        }
                    }
                });

                // Draw player car
                this.ctx.fillStyle = '#00ff99';
                this.ctx.shadowColor = '#00ff99';
                this.ctx.shadowBlur = 15;
                this.ctx.fillRect(this.car.x, this.car.y, this.car.width, this.car.height);

                // Car details
                this.ctx.fillStyle = '#000';
                this.ctx.shadowBlur = 0;
                this.ctx.fillRect(this.car.x + 5, this.car.y + 15, this.car.width - 10, 20); // Windshield
                this.ctx.fillRect(this.car.x + 5, this.car.y + 45, this.car.width - 10, 20); // Rear window

                // Headlights
                this.ctx.fillStyle = '#fff';
                this.ctx.fillRect(this.car.x + 5, this.car.y - 2, 10, 5);
                this.ctx.fillRect(this.car.x + this.car.width - 15, this.car.y - 2, 10, 5);

                // Wheels
                this.ctx.fillStyle = '#333';
                this.ctx.fillRect(this.car.x - 3, this.car.y + 10, 8, 15);
                this.ctx.fillRect(this.car.x + this.car.width - 5, this.car.y + 10, 8, 15);
                this.ctx.fillRect(this.car.x - 3, this.car.y + 55, 8, 15);
                this.ctx.fillRect(this.car.x + this.car.width - 5, this.car.y + 55, 8, 15);

                this.ctx.shadowBlur = 0;

                // Draw UI
                this.ctx.fillStyle = '#fff';
                this.ctx.font = `${Math.max(16, this.canvas.width / 40)}px Orbitron`;
                this.ctx.textAlign = 'left';
                this.ctx.shadowColor = '#000';
                this.ctx.shadowBlur = 3;
                this.ctx.fillText(`Level: ${this.level}`, 20, 40);
                this.ctx.fillText(`Coins: ${this.coinsCollected}`, 20, 70);
                this.ctx.fillText(`Speed: ${this.gameSpeed.toFixed(1)}`, 20, 100);

                // Speed indicator
                this.ctx.fillStyle = '#00ff99';
                this.ctx.fillRect(20, 110, 200, 10);
                this.ctx.fillStyle = '#fff';
                this.ctx.fillRect(22, 112, (this.gameSpeed / 10) * 196, 6);

                // Instructions
                this.ctx.fillStyle = '#fff';
                this.ctx.font = `${Math.max(12, this.canvas.width / 60)}px Orbitron`;
                this.ctx.textAlign = 'center';
                this.ctx.shadowBlur = 2;
                if (!this.running) {
                    this.ctx.fillText('Use arrow keys to drive and collect coins!', this.canvas.width / 2, this.canvas.height - 60);
                    this.ctx.fillText('Avoid obstacles and other cars!', this.canvas.width / 2, this.canvas.height - 40);
                    this.ctx.fillText('Click START GAME to begin driving!', this.canvas.width / 2, this.canvas.height - 20);
                } else {
                    this.ctx.fillText('Collect coins • Avoid obstacles • Drive fast!', this.canvas.width / 2, this.canvas.height - 20);
                }

                this.ctx.shadowBlur = 0;
            }

            drawPauseScreen() {
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                this.ctx.fillStyle = '#00ff99';
                this.ctx.font = `${Math.max(32, this.canvas.width / 15)}px Orbitron`;
                this.ctx.textAlign = 'center';
                this.ctx.shadowColor = '#00ff99';
                this.ctx.shadowBlur = 10;
                this.ctx.fillText('PAUSED', this.canvas.width / 2, this.canvas.height / 2);
                this.ctx.font = `${Math.max(16, this.canvas.width / 30)}px Orbitron`;
                this.ctx.fillText('Press Pause to continue driving', this.canvas.width / 2, this.canvas.height / 2 + 50);
                this.ctx.shadowBlur = 0;
            }

            handleKeyDown(e) {
                this.keys[e.key] = true;
                if (this.running && !this.paused) {
                    this.gameSystem.playSound('move');
                }
            }

            handleKeyUp(e) {
                this.keys[e.key] = false;
            }

            handleTouchStart(action) {
                if (action === 'up' || action === 'down' || action === 'left' || action === 'right') {
                    this.keys[`Arrow${action.charAt(0).toUpperCase() + action.slice(1)}`] = true;
                    if (this.running && !this.paused) {
                        this.gameSystem.playSound('move');
                    }
                }
            }

            handleTouchEnd(action) {
                if (action === 'up' || action === 'down' || action === 'left' || action === 'right') {
                    this.keys[`Arrow${action.charAt(0).toUpperCase() + action.slice(1)}`] = false;
                }
            }

            handleResize() {
                // Adjust car position if it's outside the new canvas bounds
                if (this.car.x > this.canvas.width - this.car.width) {
                    this.car.x = this.canvas.width - this.car.width;
                }
                if (this.car.y > this.canvas.height - this.car.height) {
                    this.car.y = this.canvas.height - this.car.height;
                }
                this.draw();
            }

            gameOver() {
                this.running = false;
                if (this.gameLoop) {
                    clearInterval(this.gameLoop);
                    this.gameLoop = null;
                }

                this.ctx.fillStyle = 'rgba(255, 0, 102, 0.8)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                this.ctx.fillStyle = '#fff';
                this.ctx.font = `${Math.max(36, this.canvas.width / 15)}px Orbitron`;
                this.ctx.textAlign = 'center';
                this.ctx.shadowColor = '#000';
                this.ctx.shadowBlur = 10;
                this.ctx.fillText('CRASH!', this.canvas.width / 2, this.canvas.height / 2 - 50);
                this.ctx.font = `${Math.max(20, this.canvas.width / 25)}px Orbitron`;
                this.ctx.fillText(`Final Score: ${this.score}`, this.canvas.width / 2, this.canvas.height / 2);
                this.ctx.fillText(`Coins Collected: ${this.coinsCollected}`, this.canvas.width / 2, this.canvas.height / 2 + 30);
                this.ctx.fillText(`Level Reached: ${this.level}`, this.canvas.width / 2, this.canvas.height / 2 + 60);
                this.ctx.fillText('Click Restart to try again!', this.canvas.width / 2, this.canvas.height / 2 + 100);
                this.ctx.shadowBlur = 0;

                this.gameSystem.playSound('gameOver');
            }
        }

        // Space Shooter Game
        class ShooterGame {
            constructor() {
                this.player = { x: 400, y: 500, width: 40, height: 40 };
                this.bullets = [];
                this.enemies = [];
                this.score = 0;
                this.running = false;
                this.gameLoop = null;
                this.keys = {};
                this.isMobile = false;
            }

            init() {
                this.player = { 
                    x: this.canvas ? this.canvas.width / 2 - 20 : 400, 
                    y: this.canvas ? this.canvas.height - 100 : 500, 
                    width: 40, 
                    height: 40 
                };
                this.bullets = [];
                this.enemies = [];
                this.score = 0;
                this.running = false;
                this.keys = {};
                this.draw();
            }

            start() {
                if (this.running) return;
                this.running = true;
                this.gameLoop = setInterval(() => this.update(), 16);

                // Spawn enemies
                this.enemySpawnInterval = setInterval(() => {
                    if (this.running) {
                        this.enemies.push({
                            x: Math.random() * (this.canvas.width - 30),
                            y: -30,
                            width: 30,
                            height: 30,
                            speed: 2 + Math.random() * 3
                        });
                    }
                }, 1000);
            }

            pause() {
                if (!this.running) return;
                this.paused = !this.paused;

                if (this.paused) {
                    if (this.gameLoop) {
                        clearInterval(this.gameLoop);
                        this.gameLoop = null;
                    }
                    if (this.enemySpawnInterval) {
                        clearInterval(this.enemySpawnInterval);
                        this.enemySpawnInterval = null;
                    }
                    this.drawPauseScreen();
                    this.gameSystem.playSound('pause');
                } else {
                    this.gameLoop = setInterval(() => this.update(), 16);
                    this.enemySpawnInterval = setInterval(() => {
                        if (this.running) {
                            this.enemies.push({
                                x: Math.random() * (this.canvas.width - 30),
                                y: -30,
                                width: 30,
                                height: 30,
                                speed: 2 + Math.random() * 3
                            });
                        }
                    }, 1000);
                    this.gameSystem.playSound('resume');
                }
            }

            drawPauseScreen() {
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                this.ctx.fillStyle = '#00ff99';
                this.ctx.font = `${Math.max(32, this.canvas.width / 15)}px Orbitron`;
                this.ctx.textAlign = 'center';
                this.ctx.shadowColor = '#00ff99';
                this.ctx.shadowBlur = 10;
                this.ctx.fillText('PAUSED', this.canvas.width / 2, this.canvas.height / 2);
                this.ctx.font = `${Math.max(16, this.canvas.width / 30)}px Orbitron`;
                this.ctx.fillText('Press Pause to continue', this.canvas.width / 2, this.canvas.height / 2 + 50);
                this.ctx.shadowBlur = 0;
            }

            restart() {
                this.pause();
                this.init();
            }

            stop() {
                this.pause();
            }

            update() {
                if (!this.running) return;

                // Move player
                if (this.keys['ArrowLeft'] || this.gameSystem.touchControls.left) {
                    if (this.player.x > 0) {
                        this.player.x -= 5;
                    }
                }
                if (this.keys['ArrowRight'] || this.gameSystem.touchControls.right) {
                    if (this.player.x < this.canvas.width - this.player.width) {
                        this.player.x += 5;
                    }
                }
                if (this.keys['ArrowUp'] || this.gameSystem.touchControls.up) {
                    if (this.player.y > 0) {
                        this.player.y -= 5;
                    }
                }
                if (this.keys['ArrowDown'] || this.gameSystem.touchControls.down) {
                    if (this.player.y < this.canvas.height - this.player.height) {
                        this.player.y += 5;
                    }
                }

                // Update bullets
                this.bullets = this.bullets.filter(bullet => {
                    bullet.y -= 10;
                    return bullet.y > 0;
                });

                // Update enemies
                this.enemies = this.enemies.filter(enemy => {
                    enemy.y += enemy.speed;
                    return enemy.y < this.canvas.height;
                });

                // Check collisions
                this.checkCollisions();
                this.draw();
            }

            checkCollisions() {
                // Bullet-enemy collisions
                for (let i = this.bullets.length - 1; i >= 0; i--) {
                    for (let j = this.enemies.length - 1; j >= 0; j--) {
                        if (this.isColliding(this.bullets[i], this.enemies[j])) {
                            this.bullets.splice(i, 1);
                            this.enemies.splice(j, 1);
                            this.score += 10;
                            this.gameSystem.updateScore(this.score);
                            break;
                        }
                    }
                }

                // Player-enemy collisions
                for (let enemy of this.enemies) {
                    if (this.isColliding(this.player, enemy)) {
                        this.gameOver();
                        return;
                    }
                }
            }

            isColliding(rect1, rect2) {
                return rect1.x < rect2.x + rect2.width &&
                    rect1.x + rect1.width > rect2.x &&
                    rect1.y < rect2.y + rect2.height &&
                    rect1.y + rect1.height > rect2.y;
            }

            shoot() {
                this.bullets.push({
                    x: this.player.x + this.player.width / 2 - 2,
                    y: this.player.y,
                    width: 4,
                    height: 10
                });
                this.gameSystem.playSound('shoot');
            }

            draw() {
                this.ctx.fillStyle = '#000';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // Draw stars
                this.ctx.fillStyle = '#fff';
                const starCount = Math.max(50, Math.floor(this.canvas.width * this.canvas.height / 5000));
                for (let i = 0; i < starCount; i++) {
                    const x = (i * 37) % this.canvas.width;
                    const y = (i * 73 + Date.now() * 0.1) % this.canvas.height;
                    this.ctx.fillRect(x, y, 1, 1);
                }

                // Draw player
                this.ctx.fillStyle = '#00ff99';
                this.ctx.shadowColor = '#00ff99';
                this.ctx.shadowBlur = 10;
                this.ctx.fillRect(this.player.x, this.player.y, this.player.width, this.player.height);

                // Draw bullets
                this.ctx.fillStyle = '#ffff00';
                this.ctx.shadowColor = '#ffff00';
                this.bullets.forEach(bullet => {
                    this.ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
                });

                // Draw enemies
                this.ctx.fillStyle = '#ff0066';
                this.ctx.shadowColor = '#ff0066';
                this.enemies.forEach(enemy => {
                    this.ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
                });

                this.ctx.shadowBlur = 0;
            }

            handleKeyDown(e) {
                this.keys[e.key] = true;
                if (e.key === ' ') {
                    this.shoot();
                    e.preventDefault();
                }
            }

            handleKeyUp(e) {
                this.keys[e.key] = false;
            }

            handleTouchStart(action) {
                if (action === 'up' || action === 'down' || action === 'left' || action === 'right') {
                    this.keys[`Arrow${action.charAt(0).toUpperCase() + action.slice(1)}`] = true;
                }
                if (action === 'action') {
                    this.shoot();
                }
            }

            handleTouchEnd(action) {
                if (action === 'up' || action === 'down' || action === 'left' || action === 'right') {
                    this.keys[`Arrow${action.charAt(0).toUpperCase() + action.slice(1)}`] = false;
                }
            }

            handleResize() {
                // Adjust player position if it's outside the new canvas bounds
                if (this.player.x > this.canvas.width - this.player.width) {
                    this.player.x = this.canvas.width - this.player.width;
                }
                if (this.player.y > this.canvas.height - this.player.height) {
                    this.player.y = this.canvas.height - this.player.height;
                }
                this.draw();
            }

            gameOver() {
                this.running = false;
                clearInterval(this.gameLoop);
                if (this.enemySpawnInterval) {
                    clearInterval(this.enemySpawnInterval);
                }

                this.ctx.fillStyle = 'rgba(255, 0, 102, 0.8)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                this.ctx.fillStyle = '#fff';
                this.ctx.font = `${Math.max(36, this.canvas.width / 15)}px Orbitron`;
                this.ctx.textAlign = 'center';

                    }

                if (this.keys['s'] || this.gameSystem.touchControls.down) {
                    if (this.paddle1.y < this.canvas.height - this.paddle1.height) {
                        this.paddle1.y += this.paddle1.speed;
                    }
                }

                // AI for paddle2
                const ballCenter = this.ball.y + this.ball.height / 2;
                const paddle2Center = this.paddle2.y + this.paddle2.height / 2;

                if (ballCenter < paddle2Center - 10) {
                    this.paddle2.y -= this.paddle2.speed * 0.8;
                } else if (ballCenter > paddle2Center + 10) {
                    this.paddle2.y += this.paddle2.speed * 0.8;
                }

                this.paddle2.y = Math.max(0, Math.min(this.canvas.height - this.paddle2.height, this.paddle2.y));

                this.ball.y += this.ball.dy;

                if (this.ball.y <= 0 || this.ball.y >= this.canvas.height - this.ball.height) {
                    this.ball.dy = -this.ball.dy;
                }

                // Ball collision with paddles
                if (this.isColliding(this.ball, this.paddle1) || this.isColliding(this.ball, this.paddle2)) {
                    this.ball.dx = -this.ball.dx;
                    this.ball.dy += (Math.random() - 0.5) * 2; // Add some randomness
                }

                if (this.ball.x < 0) {
                    this.score2++;
                    this.resetBall();
                } else if (this.ball.x > this.canvas.width) {
                    this.score1++;
                    this.resetBall();

                this.ball.x = this.canvas.width / 2;
                this.ball.y = this.canvas.height / 2;

                this.ball.dy = (Math.random() - 0.5) * 6;
            }

            isColliding(rect1, rect2) {
                return rect1.x < rect2.x + rect2.width &&
                    rect1.x + rect1.width > rect2.x &&
                    rect1.y < rect2.y + rect2.height &&
                    rect1.y + rect1.height > rect2.y;

            draw() {

                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                this.ctx.fillRect(this.paddle1.x, this.paddle1.y, this.paddle1.width, this.paddle1.height);
                this.ctx.fillRect(this.paddle2.x, this.paddle2.y, this.paddle2.width, this.paddle2.height);

                // Draw ball
                this.ctx.fillStyle = '#003366';
                this.ctx.shadowColor = '#003366';
                this.ctx.fillRect(this.ball.x, this.ball.y, this.ball.width, this.ball.height);

                // Draw scores
                this.ctx.fillStyle = '#fff';
                this.ctx.font = `${Math.max(36, this.canvas.width / 15)}px Orbitron`;
                this.ctx.textAlign = 'center';
                this.ctx.fillText(this.score1, this.canvas.width / 4, 60);
                this.ctx.fillText(this.score2, 3 * this.canvas.width / 4, 60);

                this.ctx.shadowBlur = 0;
            }

            handleKeyDown(e) {
                this.keys[e.key.toLowerCase()] = true;
            }

            handleKeyUp(e) {
                this.keys[e.key.toLowerCase()] = false;
            }

            handleTouchStart(action) {
                if (action === 'up') {
                    this.keys['w'] = true;
                }
                if (action === 'down') {
                    this.keys['s'] = true;
                }
            }

            handleTouchEnd(action) {
                if (action === 'up') {
                    this.keys['w'] = false;
                }
                if (action === 'down') {
                    this.keys['s'] = false;
                }
            }

            handleResize() {
                // Adjust positions if they're outside the new canvas bounds
                if (this.paddle1.y > this.canvas.height - this.paddle1.height) {
                    this.paddle1.y = this.canvas.height - this.paddle1.height;

                if (this.ball.y > this.canvas.height - this.ball.height) {

                }

            update() {

                // Move paddle
                if (this.keys['ArrowLeft'] || this.gameSystem.touchControls.left) {
                    if (this.paddle.x > 0) {
                        this.paddle.x -= 8;
                    }
                }
                if (this.keys['ArrowRight'] || this.gameSystem.touchControls.right) {
                    if (this.paddle.x < this.canvas.width - this.paddle.width) {
                        this.paddle.x += 8;
                    }
                }

                // Move ball
                this.ball.x += this.ball.dx;
                this.ball.y += this.ball.dy;

                // Ball collision with walls
                if (this.ball.x <= 0 || this.ball.x >= this.canvas.width - this.ball.width) {
                    this.ball.dx = -this.ball.dx;
                }
                if (this.ball.y <= 0) {
                    this.ball.dy = -this.ball.dy;
                }

                // Ball collision with paddle
                if (this.isColliding(this.ball, this.paddle)) {
                    this.ball.dy = -Math.abs(this.ball.dy);
                    // Add spin based on where ball hits paddle
                    const hitPos = (this.ball.x - this.paddle.x) / this.paddle.width;
                    this.ball.dx = (hitPos - 0.5) * 8;
                }

                // Ball collision with bricks
                for (let brick of this.bricks) {
                    if (brick.visible && this.isColliding(this.ball, brick)) {
                        brick.visible = false;
                        this.ball.dy = -this.ball.dy;
                        this.score += 10;
                        this.gameSystem.updateScore(this.score);
                        break;
                    }
                }

                // Check win condition
                if (this.bricks.every(brick => !brick.visible)) {
                    this.gameWin();
                    return;
                }

                // Check lose condition
                if (this.ball.y > this.canvas.height) {
                    this.gameOver();
                    return;
                }

                this.draw();

            isColliding(rect1, rect2) {
                return rect1.x < rect2.x + rect2.width &&
                    rect1.x + rect1.width > rect2.x &&
                    rect1.y < rect2.y + rect2.height &&
                    rect1.y + rect1.height > rect2.y;
            }

            draw() {
                this.ctx.fillStyle = '#000';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // Scale bricks based on canvas size
                const brickWidth = this.canvas.width / 12;
                const brickHeight = this.canvas.height / 25;
                const brickPadding = 2;
                const brickOffsetTop = this.canvas.height / 6;
                const brickOffsetLeft = this.canvas.width / 24;

                // Draw bricks
                this.bricks.forEach((brick, index) => {
                    if (brick.visible) {
                        const row = Math.floor(index / 10);
                        const col = index % 10;
                        const x = col * (brickWidth + brickPadding) + brickOffsetLeft;
                        const y = row * (brickHeight + brickPadding) + brickOffsetTop;
                        
                        this.ctx.fillStyle = brick.color;
                        this.ctx.shadowColor = brick.color;
                        this.ctx.shadowBlur = 5;
                        this.ctx.fillRect(x, y, brickWidth, brickHeight);
                    }
                });

                // Draw paddle
                this.ctx.fillStyle = '#00ff99';
                this.ctx.shadowColor = '#00ff99';
                this.ctx.shadowBlur = 10;
                this.ctx.fillRect(this.paddle.x, this.paddle.y, this.paddle.width, this.paddle.height);

                // Draw ball
                this.ctx.fillStyle = '#003366';
                this.ctx.shadowColor = '#003366';
                this.ctx.fillRect(this.ball.x, this.ball.y, this.ball.width, this.ball.height);

                this.ctx.shadowBlur = 0;

            handleTouchStart(action) {

                }
                if (action === 'right') {
                    this.keys['ArrowRight'] = true;
                }

                }

            handleResize() {

                if (this.paddle.x > this.canvas.width - this.paddle.width) {
                    this.paddle.x = this.canvas.width - this.paddle.width;
                }
                if (this.ball.x > this.canvas.width - this.ball.width) {
                    this.ball.x = this.canvas.width - this.ball.width;
                }
                if (this.ball.y > this.canvas.height - this.ball.height) {
                    this.ball.y = this.canvas.height - this.ball.height;

            gameWin() {

        // Asteroids Game

                };
                this.bullets = [];
                this.score = 0;
                this.running = false;
                this.keys = {};

            start() {

            pause() {
